<svg xmlns="http://www.w3.org/2000/svg" width="808" height="908" viewBox="0 0 808 908" role="img" aria-labelledby="title description">
<title id="title">Transformer (2017)</title>
<desc id="description">Six encoder and six decoder layers, with residual addition followed by layer normalisation. The encoder supplies decoder cross-attention keys and values. Token embeddings are summed with sinusoidal positional encodings.</desc>
