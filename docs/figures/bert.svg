<svg xmlns="http://www.w3.org/2000/svg" width="808" height="956" viewBox="0 0 808 956" role="img" aria-labelledby="title description">
<title id="title">BERT (2018): pre-training</title>
<desc id="description">Twelve bidirectional encoder layers with residual addition followed by layer normalisation. Token, learned position and segment embeddings are summed and normalised. Masked positions feed the masked language modelling head; the CLS state feeds the next-sentence prediction head.</desc>
