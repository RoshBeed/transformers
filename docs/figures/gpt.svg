<svg xmlns="http://www.w3.org/2000/svg" width="408" height="748" viewBox="0 0 408 748" role="img" aria-labelledby="title description">
<title id="title">GPT (2018): pre-training</title>
<desc id="description">Twelve causal decoder layers with residual addition followed by layer normalisation. Token and learned position embeddings are summed. A linear vocabulary projection and softmax predict the next token.</desc>
